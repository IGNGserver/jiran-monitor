name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      release_type:
        description: "GitHub Release type; use release only for an explicit formal release"
        required: true
        type: choice
        options:
          - prerelease
          - release
        default: prerelease

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify product scope and Node code
        run: npm run verify
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Android JVM verification
        run: |
          chmod +x android/gradlew
          ./android/gradlew --no-daemon -p android runUnitTests

  headless:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies only
        run: npm ci --omit=dev
      - name: Package headless agent
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          npm run package:headless -- "$version"
          archive="dist-headless/Jiran-Headless-${version}.tar.gz"
          file_list="$RUNNER_TEMP/headless-file-list.txt"
          tar -tzf "$archive" > "$file_list"
          grep -q "/src/agent/agent.js$" "$file_list"
          if grep -Eq '(^|/)src/(electron|hub)/|(^|/)node_modules/' "$file_list"; then
            echo "headless archive contains a GUI, Hub, or node_modules path" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jiran-headless
          if-no-files-found: error
          path: dist-headless/Jiran-Headless-*.tar.gz

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
            dist_script: dist:mac
            artifact_name: jiran-mac-arm64
            artifact_path: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/*.blockmap
          - os: macos-15-intel
            target: mac
            arch: x64
            dist_script: dist:mac:x64
            artifact_name: jiran-mac-x64
            artifact_path: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/*.blockmap
          - os: windows-latest
            target: win
            dist_script: dist:win
            artifact_name: jiran-windows
            artifact_path: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            dist_script: dist:linux
            artifact_name: jiran-linux
            artifact_path: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Platform evidence
        run: node -p "process.platform + '-' + process.arch"
      - name: Select Linux Electron runtime
        if: matrix.target == 'linux'
        run: |
          echo "TOKEN_MONITOR_ELECTRON_TARGET=linux" >> "$GITHUB_ENV"
          echo "TOKEN_MONITOR_LINUX_ELECTRON_VERSION=43.2.0" >> "$GITHUB_ENV"
      - name: Verify Electron packaging version
        run: |
          node -e "const config = require('./scripts/electron-builder.config.js'); const installed = require('electron/package.json').version; const effective = config.electronVersion || installed; const expected = process.env.TOKEN_MONITOR_LINUX_ELECTRON_VERSION || installed; console.log('Electron packaging version:', effective, '(installed:', installed + ')'); if (effective !== expected) throw new Error('Electron packaging version mismatch: expected ' + expected + ', got ' + effective);"
      - name: Decode Apple API key
        if: matrix.target == 'mac'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
          fi
      - name: Decode macOS provisioning profile
        if: matrix.target == 'mac'
        env:
          TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/token-monitor-app.provisionprofile"
            echo "TOKEN_MONITOR_APP_PROVISIONING_PROFILE=$RUNNER_TEMP/token-monitor-app.provisionprofile" >> "$GITHUB_ENV"
          fi
      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          npm run verify:release-version -- --version "$version"
      - name: Build platform artifacts
        if: matrix.target != 'win'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              export CSC_LINK="$MAC_CSC_LINK"
              export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          npm run ${{ matrix.dist_script }}
      - name: Verify Debian package metadata and version
        if: matrix.target == 'linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          deb_path="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$deb_path" ]; then
            echo "no Debian package found under dist/" >&2
            exit 1
          fi
          npm run verify:deb -- "$deb_path" --version "$version"
      - name: Verify mac code signing and notarization
        if: matrix.target == 'mac'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CSC_LINK" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "Mac code signing credentials not configured; skipping verification."
            exit 0
          fi
          app_path=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "no .app bundle found under dist/" >&2
            exit 1
          fi
          dmg_path=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg_path" ]; then
            echo "no .dmg installer found under dist/" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -vvv --type execute "$app_path"
          xcrun stapler validate "$app_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
      # Sign the branded application executable before it is embedded into the
      # NSIS installer and portable wrapper. electron-builder's --prepackaged
      # mode then packages these exact signed bytes without rebuilding the app.
      - name: Build unpacked Windows application
        if: matrix.target == 'win'
        run: npm run dist:win:dir
      # --prepackaged deliberately skips electron-builder's afterPack hooks, so
      # preserve the same updater config that a normal NSIS build would embed.
      - name: Write Windows updater configuration
        if: matrix.target == 'win'
        run: node scripts/signpath-windows-artifacts.js write-update-config dist/win-unpacked
      - name: Detect SignPath configuration
        if: matrix.target == 'win'
        id: signpath
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath is configured; Windows artifacts will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SIGNPATH_API_TOKEN is not configured; publishing an unsigned Windows build (SmartScreen may warn)."
          fi
      - name: Prepare Windows application for signing
        if: steps.signpath.outputs.enabled == 'true'
        id: prepare-unsigned-win-app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signpath-windows-artifacts.js prepare-application \
            dist/win-unpacked "$RUNNER_TEMP/signpath-application-input" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned Windows application
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-unsigned-win-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-application
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          # Upload the prepared root so the ZIP preserves application/ as the
          # path required by the SignPath artifact configuration.
          path: ${{ runner.temp }}/signpath-application-input
      - name: Code-sign Windows application (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 8bf2856b-5fb0-4c78-ba99-90931fcce837
          project-slug: token-monitor
          signing-policy-slug: release-signing
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.upload-unsigned-win-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-application-output
          parameters: |
            version: ${{ toJSON(steps.prepare-unsigned-win-app.outputs.product_version) }}
      - name: Apply signed Windows application
        if: steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signpath-windows-artifacts.js apply-application \
            dist/win-unpacked dist/signpath-application-output
      - name: Verify Windows application Authenticode signature
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $application = Get-Item -LiteralPath (Join-Path 'dist/win-unpacked' '${{ steps.prepare-unsigned-win-app.outputs.application }}') -ErrorAction Stop
          $signature = Get-AuthenticodeSignature -FilePath $application.FullName
          $subject = $signature.SignerCertificate.Subject
          Write-Output "$($application.Name) — Status: $($signature.Status), Signer: $subject"
          if ($signature.Status -ne 'Valid') {
            throw "$($application.Name) Authenticode status is $($signature.Status), expected Valid"
          }
          if ($subject -notlike '*SignPath Foundation*') {
            throw "$($application.Name) has unexpected signer: $subject"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "$($application.Name) has no Authenticode timestamp"
          }
      - name: Package Windows application
        if: matrix.target == 'win'
        run: npm run dist:win:prepackaged
      # Keep the two public filenames in separate directories so SignPath can
      # require exactly one installer and one portable exe without overlapping
      # wildcard patterns.
      - name: Prepare Windows artifacts for signing
        if: steps.signpath.outputs.enabled == 'true'
        id: prepare-unsigned-win
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signpath-windows-artifacts.js prepare-artifacts \
            dist "$RUNNER_TEMP/signpath-artifact-input" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned Windows artifacts
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-unsigned-win
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-artifacts
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          # These two exact paths share signpath-artifact-input as their archive
          # root,
          # preserving the installer/ and portable/ directories in the ZIP.
          path: |
            ${{ runner.temp }}/signpath-artifact-input/installer/${{ steps.prepare-unsigned-win.outputs.installer }}
            ${{ runner.temp }}/signpath-artifact-input/portable/${{ steps.prepare-unsigned-win.outputs.portable }}
      - name: Code-sign Windows artifacts (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 8bf2856b-5fb0-4c78-ba99-90931fcce837
          project-slug: token-monitor
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-artifact-output
          parameters: |
            version: ${{ toJSON(steps.prepare-unsigned-win.outputs.version) }}
      # electron-builder hashes latest.yml and builds the .blockmap before this
      # signing step runs, so both are stale once the signed exe replaces the
      # unsigned one; this rewrites latest.yml's sha512/size and rebuilds the
      # blockmap from the signed bytes so differential updates keep working.
      - name: Apply signed Windows artifacts
        if: steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signpath-windows-artifacts.js apply-artifacts \
            dist dist/signpath-artifact-output
      # SignPath's action succeeding only means it accepted and returned a file —
      # confirm the file it gave back is actually validly signed by the expected
      # certificate before it ships.
      - name: Verify Windows artifact Authenticode signatures
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $expected = @(
            '${{ steps.prepare-unsigned-win.outputs.installer }}',
            '${{ steps.prepare-unsigned-win.outputs.portable }}'
          )
          foreach ($fileName in $expected) {
            $artifact = Get-Item -LiteralPath (Join-Path 'dist' $fileName) -ErrorAction Stop
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            $subject = $signature.SignerCertificate.Subject
            Write-Output "$fileName — Status: $($signature.Status), Signer: $subject"
            if ($signature.Status -ne 'Valid') {
              throw "$fileName Authenticode status is $($signature.Status), expected Valid"
            }
            if ($subject -notlike '*SignPath Foundation*') {
              throw "$fileName has unexpected signer: $subject"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$fileName has no Authenticode timestamp"
            }
          }
      - name: Verify updater artifact names
        run: npm run verify:release-artifact-names
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          node scripts/verify-release-version.js --version "$version"
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/token-monitor-release.jks"
      - name: Build signed Android release
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          version="${RELEASE_VERSION#v}"
          ./android/gradlew --no-daemon -p android assembleRelease \
            -PtokenMonitorVersion="$version" \
            -PandroidKeystorePath="$RUNNER_TEMP/token-monitor-release.jks" \
            -PandroidKeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$ANDROID_KEY_ALIAS" \
            -PandroidKeyPassword="$ANDROID_KEY_PASSWORD"
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/Jiran-Android-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: jiran-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/Jiran-Android-*.apk

  hub-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      release_type: ${{ steps.meta.outputs.release_type }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve version and image name
        id: meta
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'prerelease' }}
        run: |
          raw="$RELEASE_VERSION"
          version="${raw#v}"
          release_type="$RELEASE_TYPE"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/jiran-hub"
          # Transitional dual-push: the 计然 / Jiran rename moves the image to
          # jiran-hub, but every existing compose pin still points at
          # token-monitor-hub, so it keeps receiving identical tags until the
          # migration window closes.
          legacy_image="ghcr.io/${owner}/token-monitor-hub"
          node scripts/verify-release-version.js --version "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          if [ "$release_type" = "release" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo "${image}:v${version}"
            echo "${legacy_image}:${version}"
            echo "${legacy_image}:v${version}"
            if [ "$release_type" = "release" ]; then
              echo "${image}:latest"
              echo "${legacy_image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image=${image} version=${version}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Jiran Hub
            org.opencontainers.image.description=Multi-device token usage hub with web dashboard
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Package compose deploy zip
        run: node scripts/package-hub-compose.js "${{ steps.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jiran-hub-compose
          if-no-files-found: error
          path: dist-hub-compose/Jiran-Hub-Compose-*.zip

  release:
    needs: [build, android, headless, hub-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-windows
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-linux
          path: artifacts
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-android
          path: artifacts
      - name: Download headless agent artifact
        uses: actions/download-artifact@v4
        with:
          name: jiran-headless
          path: artifacts
      - name: Download Hub artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-hub-compose
          path: artifacts
      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-mac-arm64
          path: artifacts/jiran-mac-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: jiran-mac-x64
          path: artifacts/jiran-mac-x64
      - name: Merge macOS updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find artifacts/jiran-mac-arm64 artifacts/jiran-mac-x64 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -exec cp {} artifacts/ \;
          node scripts/merge-mac-updater-metadata.js \
            artifacts/latest-mac.yml \
            artifacts/jiran-mac-arm64/latest-mac.yml \
            artifacts/jiran-mac-x64/latest-mac.yml
          node scripts/verify-updater-artifact-names.js artifacts
      - name: Resolve release version
        id: ver
        run: |
          version="${{ needs.hub-image.outputs.version }}"
          release_type="${{ needs.hub-image.outputs.release_type }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
      - name: Render release body from the Chinese template
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_TYPE: ${{ steps.ver.outputs.release_type }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.js \
            --version "${RELEASE_VERSION}" \
            --template .github/RELEASE_TEMPLATE.md \
            --output release-body.md \
            --repository "${GITHUB_REPOSITORY_SLUG}" \
            --owner "${GITHUB_REPOSITORY_OWNER_NAME}" \
            --release-type "${RELEASE_TYPE}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Jiran ${{ steps.ver.outputs.tag }}
          prerelease: ${{ needs.hub-image.outputs.prerelease }}
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/Jiran-Android-*.apk
            artifacts/Jiran-Headless-*.tar.gz
            artifacts/latest.yml
            artifacts/latest-linux.yml
            artifacts/latest-mac.yml
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
          body_path: release-body.md
      - name: Trigger website deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=release-published
