services:
  mysql:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_monitor}
      MYSQL_USER: ${MYSQL_USER:-token_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - token-monitor-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  hub:
    # Published with Windows/Android on each GitHub Release (GHCR).
    # Pin a version with JIRAN_VERSION=0.34.2 (or v0.34.2); TOKEN_MONITOR_VERSION still works.
    image: ghcr.io/igngserver/jiran-hub:${TOKEN_MONITOR_VERSION:-${JIRAN_VERSION:-latest}}
    # Optional local build for contributors (git clone + Dockerfile present):
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TOKEN_MONITOR_PORT: 17321
      TOKEN_MONITOR_HOST: 0.0.0.0
      TOKEN_MONITOR_SECRET: ${TOKEN_MONITOR_SECRET:-${JIRAN_SECRET:-}}
      TOKEN_MONITOR_ALLOW_INSECURE_HTTP: ${TOKEN_MONITOR_ALLOW_INSECURE_HTTP:-${JIRAN_ALLOW_INSECURE_HTTP:-0}}
      TOKEN_MONITOR_STALE_AFTER_MS: ${TOKEN_MONITOR_STALE_AFTER_MS:-${JIRAN_STALE_AFTER_MS:-600000}}
      # The one calendar every syncing device buckets its today/month windows
      # into (IANA name, e.g. Asia/Shanghai). Unset keeps each device on its own
      # OS zone; when set, the Hub advertises it and devices align, so the fleet
      # aggregate only steps at this zone's midnight instead of dropping one
      # device at a time at its own. Setting it also changes day boundaries on
      # each device's tokscale bucketing (a one-time history re-key).
      TOKEN_MONITOR_FLEET_TIMEZONE: ${TOKEN_MONITOR_FLEET_TIMEZONE:-${JIRAN_FLEET_TIMEZONE:-}}
      # Proxy-aware client IPs for the auth-failure limiter. Leave unset unless a
      # trusted reverse proxy sets X-Forwarded-For; Cloudflare's
      # cf-connecting-ip header is only honoured when this is enabled.
      TOKEN_MONITOR_TRUST_PROXY: ${TOKEN_MONITOR_TRUST_PROXY:-${JIRAN_TRUST_PROXY:-0}}
      # Account refresh cadence and the hard ceiling for one provider probe.
      # The probe deadline is what keeps a provider that never answers from
      # holding the refresh latch and silently stopping all limit refreshes.
      TOKEN_MONITOR_HUB_REFRESH_MS: ${TOKEN_MONITOR_HUB_REFRESH_MS:-${JIRAN_HUB_REFRESH_MS:-300000}}
      TOKEN_MONITOR_HUB_ACCOUNT_CONCURRENCY: ${TOKEN_MONITOR_HUB_ACCOUNT_CONCURRENCY:-${JIRAN_HUB_ACCOUNT_CONCURRENCY:-4}}
      TOKEN_MONITOR_HUB_PROBE_DEADLINE_MS: ${TOKEN_MONITOR_HUB_PROBE_DEADLINE_MS:-${JIRAN_HUB_PROBE_DEADLINE_MS:-60000}}
      # Coalescing window for the fleet stats aggregation (ms).
      TOKEN_MONITOR_HUB_STATS_TTL_MS: ${TOKEN_MONITOR_HUB_STATS_TTL_MS:-${JIRAN_HUB_STATS_TTL_MS:-1000}}
      # Legacy credential-encryption override and the Google OAuth client secret
      # used by the Antigravity account adapter.
      TOKEN_MONITOR_HUB_CREDENTIAL_KEY: ${TOKEN_MONITOR_HUB_CREDENTIAL_KEY:-}
      AGY_OAUTH_CLIENT_SECRET: ${AGY_OAUTH_CLIENT_SECRET:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_monitor}
      MYSQL_USER: ${MYSQL_USER:-token_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Pool sizing and backpressure. queueLimit bounds the wait queue so a
      # saturated pool returns 503 instead of hanging every DB-backed route.
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_QUEUE_LIMIT: ${MYSQL_QUEUE_LIMIT:-200}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-10000}
      TOKSCALE_PRICING_CATALOG_URL: ${TOKSCALE_PRICING_CATALOG_URL:-https://models.dev/api.json}
      # Optional HTTPS (enable true PWA install on mobile LAN clients):
      TOKEN_MONITOR_TLS_CERT: ${TOKEN_MONITOR_TLS_CERT:-}
      TOKEN_MONITOR_TLS_KEY: ${TOKEN_MONITOR_TLS_KEY:-}
      TOKEN_MONITOR_TLS_CA: ${TOKEN_MONITOR_TLS_CA:-}
    # Mount certs when TLS env paths are set, e.g.:
    # volumes:
    #   - ./certs:/certs:ro
    ports:
      - "${TOKEN_MONITOR_PORT:-${JIRAN_PORT:-17321}}:17321"
    # Give the container a real health signal. Without one a Hub that is bound to
    # loopback inside the container (no TOKEN_MONITOR_SECRET) or wedged on a stuck
    # query still reports "running", so `docker compose ps` looks healthy while
    # nothing answers on the published port.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const s=process.env.TOKEN_MONITOR_TLS_CERT?'https':'http';
          require(s).get({host:'127.0.0.1',port:17321,path:'/api/health',rejectUnauthorized:false,timeout:4000},
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).on('timeout',function(){this.destroy();process.exit(1);});"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  token-monitor-mysql:
